[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-space-defense-osint"
version = "0.1.0"
description = "mcp space defense osint developer toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "httpx>=0.28,<1", "skyfield>=1.49,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
space-defense-osint = "space_defense_osint.server:main"

[project.urls]
Repository = "https://github.com/melgoldstein/mcp-space-defense-osint"
Issues = "https://github.com/melgoldstein/mcp-space-defense-osint/issues"

[tool.setuptools]
packages = ["space_defense_osint"]
package-dir = {"space_defense_osint"="src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
